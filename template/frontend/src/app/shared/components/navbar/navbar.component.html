<mat-toolbar color="primary" *ngIf="authService.isAuthenticated()">
  <span>Developer Store</span>
  <span class="spacer"></span>
  <button mat-button routerLink="/products" routerLinkActive="active">
    <mat-icon>inventory_2</mat-icon>
    Products
  </button>
  <button mat-button routerLink="/sales" routerLinkActive="active">
    <mat-icon>point_of_sale</mat-icon>
    Sales
  </button>
  <button mat-button routerLink="/cart" routerLinkActive="active">
    <mat-icon [matBadge]="(cartItemCount$ | async) || null"
              matBadgeColor="accent"
              matBadgeSize="small"
              [matBadgeHidden]="!(cartItemCount$ | async)">shopping_cart</mat-icon>
    Cart
  </button>
  <span class="spacer"></span>
  <span class="user-name" *ngIf="authService.currentUser">
    {{ authService.currentUser.name }}
  </span>
  <button mat-icon-button (click)="logout()" matTooltip="Logout">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>
