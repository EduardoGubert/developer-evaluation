<div class="page-container">
  <div class="page-header">
    <h1>Carts</h1>
  </div>

  <app-loading [isLoading]="isLoading"></app-loading>

  <div class="table-container" *ngIf="!isLoading && carts.length > 0">
    <table mat-table [dataSource]="carts" class="full-width">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let cart" class="id-cell">{{ cart.id | slice:0:8 }}...</td>
      </ng-container>

      <ng-container matColumnDef="userId">
        <th mat-header-cell *matHeaderCellDef>User ID</th>
        <td mat-cell *matCellDef="let cart" class="id-cell">{{ cart.userId | slice:0:8 }}...</td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let cart">{{ cart.date | date:'medium' }}</td>
      </ng-container>

      <ng-container matColumnDef="products">
        <th mat-header-cell *matHeaderCellDef>Products</th>
        <td mat-cell *matCellDef="let cart">
          <span class="product-count">{{ cart.products?.length || 0 }} item(s)</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let cart">
          <button mat-icon-button color="warn" (click)="deleteCart(cart.id)" matTooltip="Delete Cart">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <div class="no-data" *ngIf="!isLoading && carts.length === 0">
    <mat-icon>shopping_cart</mat-icon>
    <p>No carts found.</p>
  </div>

  <div class="pagination" *ngIf="totalPages > 1">
    <button mat-icon-button [disabled]="currentPage === 1" (click)="onPageChange(currentPage - 1)">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <span class="page-info">Page {{ currentPage }} of {{ totalPages }} ({{ totalCount }} items)</span>
    <button mat-icon-button [disabled]="currentPage === totalPages" (click)="onPageChange(currentPage + 1)">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</div>
