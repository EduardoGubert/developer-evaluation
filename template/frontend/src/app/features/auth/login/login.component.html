<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Developer Store</mat-card-title>
      <mat-card-subtitle>Sign in to your account</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email" required placeholder="admin@ambev.com">
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="password" name="password" required>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <div class="error-message" *ngIf="error">
          <mat-icon>error</mat-icon>
          {{ error }}
        </div>

        <button mat-raised-button color="primary" type="submit" class="full-width login-button" [disabled]="isLoading">
          <mat-spinner *ngIf="isLoading" [diameter]="20" class="inline-spinner"></mat-spinner>
          <span *ngIf="!isLoading">Sign In</span>
        </button>

        <div class="register-link">
          Don't have an account? <a routerLink="/login/register">Create account</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
