<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Developer Store</mat-card-title>
      <mat-card-subtitle>Create your account</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()" class="register-form">
        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>First Name</mat-label>
            <input matInput [(ngModel)]="user.name.firstname" name="firstname" required>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Last Name</mat-label>
            <input matInput [(ngModel)]="user.name.lastname" name="lastname" required>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="user.email" name="email" required>
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput [(ngModel)]="user.username" name="username" required>
          <mat-icon matSuffix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Phone</mat-label>
          <input matInput [(ngModel)]="user.phone" name="phone" placeholder="+5511999999999">
          <mat-icon matSuffix>phone</mat-icon>
        </mat-form-field>

        <div class="section-label">Address</div>

        <div class="form-row">
          <mat-form-field appearance="outline">
            <mat-label>City</mat-label>
            <input matInput [(ngModel)]="user.address.city" name="city">
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Zipcode</mat-label>
            <input matInput [(ngModel)]="user.address.zipcode" name="zipcode">
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field appearance="outline" class="street-field">
            <mat-label>Street</mat-label>
            <input matInput [(ngModel)]="user.address.street" name="street">
          </mat-form-field>

          <mat-form-field appearance="outline" class="number-field">
            <mat-label>Number</mat-label>
            <input matInput type="number" [(ngModel)]="user.address.number" name="number">
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="user.password" name="password" required>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" [(ngModel)]="confirmPassword" name="confirmPassword" required>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width submit-button" [disabled]="isLoading">
          <mat-spinner *ngIf="isLoading" [diameter]="20" class="inline-spinner"></mat-spinner>
          <span *ngIf="!isLoading">Create Account</span>
        </button>

        <div class="login-link">
          Already have an account? <a routerLink="/login">Sign in</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
