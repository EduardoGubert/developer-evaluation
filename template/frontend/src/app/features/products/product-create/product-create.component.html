<div class="page-container">
  <button mat-button (click)="goBack()" class="back-button">
    <mat-icon>arrow_back</mat-icon> Back to Products
  </button>

  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>New Product</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()" class="product-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput [(ngModel)]="product.title" name="title" required>
        </mat-form-field>

        <div class="form-row">
          <mat-form-field appearance="outline" class="flex-2">
            <mat-label>Category</mat-label>
            <input matInput [(ngModel)]="product.category" name="category" required
                   [matAutocomplete]="autoCat" (ngModelChange)="filterCategories($event)"
                   placeholder="Type or select a category">
            <mat-autocomplete #autoCat="matAutocomplete">
              <mat-option *ngFor="let cat of filteredCategories" [value]="cat">{{ cat }}</mat-option>
            </mat-autocomplete>
          </mat-form-field>

          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>Price</mat-label>
            <input matInput type="number" [(ngModel)]="product.price" name="price" required min="0.01" step="0.01">
            <span matPrefix>R$&nbsp;</span>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput [(ngModel)]="product.description" name="description" rows="4"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Image URL</mat-label>
          <input matInput [(ngModel)]="product.image" name="image" placeholder="https://...">
          <mat-icon matSuffix>image</mat-icon>
        </mat-form-field>

        <div class="section-label">Rating</div>
        <div class="form-row">
          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>Rate</mat-label>
            <input matInput type="number" [(ngModel)]="product.rating.rate" name="rate" min="0" max="5" step="0.1">
          </mat-form-field>

          <mat-form-field appearance="outline" class="flex-1">
            <mat-label>Count</mat-label>
            <input matInput type="number" [(ngModel)]="product.rating.count" name="count" min="0">
          </mat-form-field>
        </div>

        <div class="form-actions">
          <button mat-button type="button" (click)="goBack()">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="isLoading">
            <mat-spinner *ngIf="isLoading" [diameter]="20" class="inline-spinner"></mat-spinner>
            <span *ngIf="!isLoading">Create Product</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
